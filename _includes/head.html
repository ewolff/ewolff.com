<head>
  <meta charset="UTF-8">
  {% if page.title == "Eberhard Wolff" %}
  <title>{{ page.title }}</title>
  {% else %}
  <title>{{ page.title }} | Eberhard Wolff</title>
  {% endif %}
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#157878">
  <link rel="stylesheet" href="{{ site.baseurl }}/css/normalize.css">
  <link rel="stylesheet" href="{{ site.baseurl }}/css/cayman.css">
  <link rel="stylesheet" href="{{ site.baseurl }}/css/custom.css">
  <meta name="twitter:card" content="summary" />
  <meta property="og:url" content="{{ site.url }}{{ page.url }}" />
  {% if page.title == "Eberhard Wolff" %}
  <meta property="og:title" content="{{ page.title }}" />
  {% else %}
  <meta property="og:title" content="{{ page.title }} | Eberhard Wolff" />
  {% endif %}
  <meta property="og:type" content="{{ page.type | default: "article" }}" />
</head>
